<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Launching & Product Showcase</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0a0f;
            color: #f1f1f5;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 1200px;
            margin: 0 auto 40px auto;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #e2a882;
            letter-spacing: 2px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(226, 168, 130, 0.3);
            background: rgba(255, 255, 255, 0.05);
            color: #f1f1f5;
            font-size: 12px;
            transition: all 0.3s;
        }

        button:hover {
            background: #e2a882;
            color: #0b0a0f;
        }

        .hero {
            text-align: center;
            max-width: 800px;
            margin: 0 auto 50px auto;
        }

        .hero h1 {
            color: #e2a882;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #a0a0ab;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .time-card {
            background: rgba(20, 18, 27, 0.7);
            border: 1px solid rgba(226, 168, 130, 0.2);
            border-radius: 12px;
            padding: 20px 10px;
        }

        .time-number {
            font-size: 36px;
            font-weight: bold;
            color: #ffffff;
            display: block;
        }

        .time-label {
            font-size: 10px;
            color: #e2a882;
            letter-spacing: 2px;
            margin-top: 5px;
            display: block;
        }

        .catalog-section {
            max-width: 1200px;
            margin: 60px auto 0 auto;
        }

        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-bar input,
        .filter-bar select {
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #171520;
            color: #fff;
            outline: none;
            font-size: 12px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: rgba(28, 25, 38, 0.6);
            border: 1px solid rgba(226, 168, 130, 0.15);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .product-info {
            padding: 15px;
        }

        .product-title {
            font-size: 16px;
            color: #e2a882;
            margin-bottom: 8px;
        }

        .product-desc {
            font-size: 12px;
            color: #a0a0ab;
            line-height: 1.4;
        }

        .product-footer {
            padding: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-price {
            color: #e2a882;
            font-weight: bold;
        }

        .action-btns {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
        }

        .edit-btn {
            background: rgba(226, 168, 130, 0.8);
            border: none;
            color: #0b0a0f;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: bold;
        }

        .delete-btn {
            background: rgba(200, 0, 0, 0.8);
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 10px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #171520;
            border: 1px solid #e2a882;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
        }

        .modal-content h3 {
            color: #e2a882;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            color: #a0a0ab;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            outline: none;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">PUDOT & RISOL GEMOYY</div>
        <div class="btn-group">
            <button id="adminAuthBtn" onclick="toggleAdminAuth()">Login Admin</button>
            <button id="btnAddProduct" class="hidden" onclick="openModal('add')">+ Tambah Menu</button>
        </div>
    </header>

    <section class="hero">
        <h1>Peluncuran Menu Eksklusif</h1>
        <p>Nantikan kehadiran cita rasa & kemewahan baru pada 9 Oktober 2026 pada gelar karya alkenzie </p>

        <div class="countdown-grid">
            <div class="time-card">
                <span id="days" class="time-number">00</span>
                <span class="time-label">HARI</span>
            </div>
            <div class="time-card">
                <span id="hours" class="time-number">00</span>
                <span class="time-label">JAM</span>
            </div>
            <div class="time-card">
                <span id="minutes" class="time-number">00</span>
                <span class="time-label">MENIT</span>
            </div>
            <div class="time-card">
                <span id="seconds" class="time-number">00</span>
                <span class="time-label">DETIK</span>
            </div>
        </div>
    </section>

    <section class="catalog-section">
        <div class="filter-bar">
            <h2>Katalog Pilihan</h2>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Cari menu...">
                <select id="categoryFilter" onchange="filterProducts()">
                    <option value="all">Semua Kategori</option>
                    <option value="Pudot">Pudot</option>
                    <option value="Risol">Risol</option>
                </select>
            </div>
        </div>

        <div id="productGrid" class="product-grid"></div>
    </section>

    <!-- MODAL ADD / EDIT PRODUCT -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Tambah Menu Baru</h3>
            <form onsubmit="handleSaveProduct(event)">
                <input type="hidden" id="prodId">
                <div class="form-group">
                    <label>Nama Menu</label>
                    <input type="text" id="prodTitle" required>
                </div>
                <div class="form-group">
                    <label>Harga (Rp)</label>
                    <input type="text" id="prodPrice" required>
                </div>
                <div class="form-group">
                    <label>Kategori</label>
                    <select id="prodCategory">
                        <option value="Pudot">Pudot</option>
                        <option value="Risol">Risol</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>URL Gambar</label>
                    <input type="url" id="prodImage" required>
                </div>
                <div class="form-group">
                    <label>Deskripsi</label>
                    <textarea id="prodDesc" rows="3" required></textarea>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" onclick="closeModal()">Batal</button>
                    <button type="submit" style="background: #e2a882; color: #0b0a0f;">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // PASSWORD ADMIN (Silakan ubah sesuai kebutuhan)
        const ADMIN_PASSWORD = "admin123";

        // 1. COUNTDOWN TIMER
        const TARGET_DATE = new Date("2026-10-09T07:30:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = TARGET_DATE - now;

            if (distance <= 0) {
                document.getElementById('days').innerText = "00";
                document.getElementById('hours').innerText = "00";
                document.getElementById('minutes').innerText = "00";
                document.getElementById('seconds').innerText = "00";
                return;
            }

            document.getElementById('days').innerText = String(Math.floor(distance / (1000 * 60 * 60 * 24))).padStart(2, '0');
            document.getElementById('hours').innerText = String(Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
            document.getElementById('minutes').innerText = String(Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
            document.getElementById('seconds').innerText = String(Math.floor((distance % (1000 * 60)) / 1000)).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // 2. PRODUK DATA
        const defaultProducts = [
            { id: 1, title: 'Risol Mayo Original', price: '4.000', category: 'Risol', image: 'https://cdn.phototourl.com/member/2026-10-04-44d4c380-111e-43ab-b813-8d8f48b0bff3.jpg', description: 'kombinasi antara Kulit risol yang crunchy dan dipadukan dengan isian mayo yang creamy.' },
            { id: 2, title: 'Risol Mayo Smoke Beef', price: '4.000', category: 'Risol', image: 'https://cdn.phototourl.com/member/2026-10-04-aaf623a3-fc65-48bc-936b-000b228b35da.jpg', description: 'Kobinasi antara Kulit risol yang crunchy dan dipadukan dengan isian mayo yang creamy dan simple beef yang lembut.' },
            { id: 3, title: 'Risol Chocolate Cheese', price: '4.500', category: 'Risol', image: 'https://cdn.phototourl.com/member/2026-10-04-5ec0374d-d5b6-428a-bac5-95b6b50b64ed.jpg', description: 'kombinasi antara Kulit risol yang crunchy dan dipadukan dengan saus coklat yang lumer dan creamy.' },
            { id: 4, title: 'Risol Matcha Cheese', price: '4.500', category: 'Risol', image: 'https://cdn.phototourl.com/member/2026-10-04-4b8ff7b5-d09b-4d96-ae1b-83bb652db31a.jpg', description: 'kombinasi antara Kulit risol yang crunchy dan dipadukan dengan saus matcha yang lumer dan umami.' },
            { id: 5, title: 'Pudot Aneka Rasa', price: '3.000', category: 'Pudot', image: 'https://cdn.phototourl.com/member/2026-10-04-d54d7621-c75d-4ac3-a653-bb5554635048.jpg', description: 'kombinasi antara puding yang lembut dan manis disajikan dalam keadaan dingin dan dikemas dalam Zipper pounce sehingga mudah untuk dimakan di mana saja.' },
        ];

        let products = JSON.parse(localStorage.getItem('products')) || defaultProducts;
        let isAdmin = false;

        function saveToStorage() {
            localStorage.setItem('products', JSON.stringify(products));
        }

        function renderProducts(items = products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            items.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    ${isAdmin ? `
                        <div class="action-btns">
                            <button class="edit-btn" onclick="openModal('edit', ${product.id})">Edit</button>
                            <button class="delete-btn" onclick="deleteProduct(${product.id})">Hapus</button>
                        </div>
                    ` : ''}
                    <div>
                        <img src="${product.image}" alt="${product.title}">
                        <div class="product-info">
                            <div class="product-title">${product.title}</div>
                            <div class="product-desc">${product.description}</div>
                        </div>
                    </div>
                    <div class="product-footer">
                        <span style="font-size: 11px; color: #a0a0ab;">${product.category}</span>
                        <span class="product-price">Rp ${product.price}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterProducts() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;

            const filtered = products.filter(p => {
                const matchSearch = p.title.toLowerCase().includes(search) || p.description.toLowerCase().includes(search);
                const matchCat = category === 'all' || p.category === category;
                return matchSearch && matchCat;
            });

            renderProducts(filtered);
        }

        function toggleAdminAuth() {
            if (!isAdmin) {
                const inputPass = prompt("Masukkan password admin:");
                if (inputPass === ADMIN_PASSWORD) {
                    isAdmin = true;
                    alert("Berhasil masuk mode Admin!");
                } else if (inputPass !== null) {
                    alert("Password salah!");
                    return;
                }
            } else {
                isAdmin = false;
                alert("Berhasil keluar dari mode Admin.");
            }

            document.getElementById('adminAuthBtn').innerText = isAdmin ? "Logout Admin" : "Login Admin";
            document.getElementById('btnAddProduct').classList.toggle('hidden', !isAdmin);
            filterProducts();
        }

        function openModal(mode, id = null) {
            const modal = document.getElementById('productModal');
            const title = document.getElementById('modalTitle');

            if (mode === 'edit' && id) {
                const prod = products.find(p => p.id === id);
                if (prod) {
                    title.innerText = "Edit Menu";
                    document.getElementById('prodId').value = prod.id;
                    document.getElementById('prodTitle').value = prod.title;
                    document.getElementById('prodPrice').value = prod.price;
                    document.getElementById('prodCategory').value = prod.category;
                    document.getElementById('prodImage').value = prod.image;
                    document.getElementById('prodDesc').value = prod.description;
                }
            } else {
                title.innerText = "Tambah Menu Baru";
                document.getElementById('prodId').value = '';
                document.getElementById('prodTitle').value = '';
                document.getElementById('prodPrice').value = '';
                document.getElementById('prodCategory').value = 'Pudot';
                document.getElementById('prodImage').value = '';
                document.getElementById('prodDesc').value = '';
            }

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        function handleSaveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('prodId').value;
            const title = document.getElementById('prodTitle').value;
            const price = document.getElementById('prodPrice').value;
            const category = document.getElementById('prodCategory').value;
            const image = document.getElementById('prodImage').value;
            const description = document.getElementById('prodDesc').value;

            if (id) {
                // Mode Edit
                const index = products.findIndex(p => p.id == id);
                if (index !== -1) {
                    products[index] = { id: Number(id), title, price, category, image, description };
                }
            } else {
                // Mode Tambah
                const newProd = {
                    id: Date.now(),
                    title,
                    price,
                    category,
                    image,
                    description
                };
                products.unshift(newProd);
            }

            saveToStorage();
            closeModal();
            filterProducts();
        }

        function deleteProduct(id) {
            if (confirm("Apakah Anda yakin ingin menghapus menu ini?")) {
                products = products.filter(p => p.id !== id);
                saveToStorage();
                filterProducts();
            }
        }

        renderProducts();
    </script>
</body>

</html>
